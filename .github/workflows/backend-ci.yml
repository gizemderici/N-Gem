name: Backend CI

on:
  push:
    branches: [Backend]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit and PostgreSQL integration tests
        run: bash ./gradlew test integrationTest --no-daemon

  recommender-lab:
    name: Offline evaluation and ranker parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/recommender-lab

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Kotlin sıralayıcısı ile Python karşılığının ayrışmadığını doğrular.
      # Ayrıştıkları an çevrimdışı değerlendirme üretimdeki modeli ölçmeyi
      # bırakır ve bunu fark etmenin başka yolu yok.
      - name: Run recommender-lab tests
        run: python -m unittest discover -s tests -v
