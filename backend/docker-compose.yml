services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexi
      POSTGRES_USER: nexi
      POSTGRES_PASSWORD: nexi_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexi -d nexi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/nexi
      DATABASE_USER: nexi
      DATABASE_PASSWORD: nexi_dev_password
      JWT_SECRET: ${JWT_SECRET:-nexi-local-demo-secret-change-before-sharing-2026}
      JWT_ISSUER: nexi-backend
      JWT_AUDIENCE: nexi-mobile
      EXPOSE_DEVELOPMENT_CODES: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: nexi
      STORAGE_SECRET_KEY: nexi_dev_storage_password
      STORAGE_BUCKET: nexi-media
      MAX_IMAGE_SIZE_BYTES: 10485760
      MAX_VIDEO_SIZE_BYTES: 26214400
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexi
      MINIO_ROOT_PASSWORD: nexi_dev_storage_password
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - nexi_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nexi_postgres_data:
  nexi_minio_data:
